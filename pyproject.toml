[project]
name = "eve-healthcare-api"
version = "0.1.0"
description = "Diagnostic test booking and simulated payment service"
requires-python = ">=3.9"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "PyJWT>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
